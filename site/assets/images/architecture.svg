<svg xmlns="http://www.w3.org/2000/svg" width="960" height="656" viewBox="0 0 960 656" role="img" aria-labelledby="title desc">
<title id="title">Blackjack system architecture</title>
<desc id="desc">Linux runs ROS 2 and NPU inference. The first mechanical build includes antenna provisions. After base bring-up, Linux handles LTE and routes RTCM corrections to the ZED-F9P. The stock UGV02 controller handles motor drive. Dashed paths show the STM32H5 experiment: capture the GNSS time pulse and test a local heading loop with an independent IMU. Direct Linux control and STM32 control are separate test configurations.</desc>
