<svg xmlns="http://www.w3.org/2000/svg" width="900" height="364" viewBox="0 0 900 364" role="img" aria-labelledby="title desc">
<title id="title">One switch, two loads</title>
<desc id="desc">In the candidate topology, the deck switch controls the stock 3S battery module output. That switched rail feeds the existing UGV02 motor driver and a fused branch to the VENTUNO Q barrel jack. Both loads draw through the battery module.</desc>
