<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="How Blackjack is engineered"><defs><marker id="a4fa3ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4fa3ff"/></marker><marker id="b4fa3ff" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4fa3ff"/></marker><marker id="a3fb950" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker><marker id="b3fb950" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#3fb950"/></marker><marker id="ad29922" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d29922"/></marker><marker id="bd29922" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#d29922"/></marker><marker id="a9aa7b4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9aa7b4"/></marker><marker id="b9aa7b4" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#9aa7b4"/></marker></defs><rect width="1200" height="470" rx="14" fill="#0f1318"/><text x="32" y="44" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#e6edf3">How Blackjack is engineered</text><text x="32" y="66" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa7b4">Every number is traced to a source, every decision is recorded with who proposed it and who decided. Counts on 14 November 2026.</text><rect x="28" y="88" width="1144" height="58" rx="10" fill="#171d25" stroke="#3fb950" stroke-width="1.5"/><text x="48" y="112" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#3fb950">ALESSANDRO PISTELLA</text><text x="48" y="132" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa7b4">sets the goals, takes every decision, reviews and corrects the work, approves what is published</text><rect x="28" y="176" width="208" height="128" rx="8" fill="#171d25" stroke="#3a4656" stroke-width="1.5"/><text x="42" y="201" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">1. Sources</text><text x="42" y="221" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">58 archived documents</text><text x="42" y="238" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">data sheets, schematics,</text><text x="42" y="255" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">official CAD models,</text><text x="42" y="272" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">each with its SHA-256</text><rect x="262" y="176" width="208" height="128" rx="8" fill="#171d25" stroke="#3a4656" stroke-width="1.5"/><text x="276" y="201" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">2. Measurements</text><text x="276" y="221" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">83 numbered records</text><text x="276" y="238" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">taken on the official</text><text x="276" y="255" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">models and drawings,</text><text x="276" y="272" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">reproducible by script</text><rect x="496" y="176" width="208" height="128" rx="8" fill="#171d25" stroke="#3a4656" stroke-width="1.5"/><text x="510" y="201" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">3. Decisions</text><text x="510" y="221" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">86 recorded decisions</text><text x="510" y="238" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">who proposed, who decided,</text><text x="510" y="255" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">the reason and the</text><text x="510" y="272" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">alternatives rejected</text><rect x="730" y="176" width="208" height="128" rx="8" fill="#171d25" stroke="#3a4656" stroke-width="1.5"/><text x="744" y="201" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">4. Design</text><text x="744" y="221" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">parametric CAD model,</text><text x="744" y="238" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">build scripts, flat patterns,</text><text x="744" y="255" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">studies with sources,</text><text x="744" y="272" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">bill of materials</text><rect x="964" y="176" width="208" height="128" rx="8" fill="#171d25" stroke="#4fa3ff" stroke-width="1.5"/><text x="978" y="201" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">5. Release gate</text><text x="978" y="221" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">checked against 22 written</text><text x="978" y="238" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">invariants; only what is</text><text x="978" y="255" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">mature and verified goes</text><text x="978" y="272" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">to this repository</text><path d="M236 240 L262 240" fill="none" stroke="#4fa3ff" stroke-width="2" marker-end="url(#a4fa3ff)"/><path d="M470 240 L496 240" fill="none" stroke="#4fa3ff" stroke-width="2" marker-end="url(#a4fa3ff)"/><path d="M704 240 L730 240" fill="none" stroke="#4fa3ff" stroke-width="2" marker-end="url(#a4fa3ff)"/><path d="M938 240 L964 240" fill="none" stroke="#4fa3ff" stroke-width="2" marker-end="url(#a4fa3ff)"/><rect x="28" y="334" width="1144" height="58" rx="10" fill="#171d25" stroke="#4fa3ff" stroke-width="1.5"/><text x="48" y="358" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#4fa3ff">AI AGENTS</text><text x="48" y="378" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa7b4">model, calculate, search and draft under written rules; they record their own errors and never publish or decide on their own</text><path d="M132 146 L132 176" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#a3fb950)"/><path d="M132 334 L132 304" fill="none" stroke="#4fa3ff" stroke-width="2" marker-end="url(#a4fa3ff)"/><path d="M366 146 L366 176" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#a3fb950)"/><path d="M366 334 L366 304" fill="none" stroke="#4fa3ff" stroke-width="2" marker-end="url(#a4fa3ff)"/><path d="M600 146 L600 176" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#a3fb950)"/><path d="M600 334 L600 304" fill="none" stroke="#4fa3ff" stroke-width="2" marker-end="url(#a4fa3ff)"/><path d="M834 146 L834 176" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#a3fb950)"/><path d="M834 334 L834 304" fill="none" stroke="#4fa3ff" stroke-width="2" marker-end="url(#a4fa3ff)"/><path d="M1068 146 L1068 176" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#a3fb950)"/><path d="M1068 334 L1068 304" fill="none" stroke="#4fa3ff" stroke-width="2" marker-end="url(#a4fa3ff)"/><text x="32" y="430" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa7b4">A single source of truth holds state, decisions, measurements and sources. It survives any single chat, tool or agent.</text><text x="32" y="450" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa7b4">The private workspace keeps the full history, including the mistakes; this repository receives the verified result.</text></svg>