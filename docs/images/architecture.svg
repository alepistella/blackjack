<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 750" width="1400" height="750" role="img" aria-label="Blackjack system architecture"><defs><marker id="a4fa3ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4fa3ff"/></marker><marker id="b4fa3ff" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4fa3ff"/></marker><marker id="a3fb950" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker><marker id="b3fb950" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#3fb950"/></marker><marker id="ad29922" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d29922"/></marker><marker id="bd29922" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#d29922"/></marker><marker id="a9aa7b4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9aa7b4"/></marker><marker id="b9aa7b4" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#9aa7b4"/></marker></defs><rect width="1400" height="750" rx="14" fill="#0f1318"/><text x="32" y="44" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#e6edf3">Blackjack - system architecture</text><text x="32" y="66" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa7b4">Base configuration. Design stage: no hardware built yet.</text><rect x="30" y="96" width="340" height="474" rx="12" fill="none" stroke="#9aa7b4" stroke-width="1.2" opacity="0.8"/><text x="48" y="119" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#9aa7b4" letter-spacing="0.4">WAVESHARE UGV02 (STOCK, UNMODIFIED)</text><rect x="470" y="96" width="340" height="474" rx="12" fill="none" stroke="#4fa3ff" stroke-width="1.2" opacity="0.8"/><text x="488" y="119" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#4fa3ff" letter-spacing="0.4">BLACKJACK KIT (THIS PROJECT)</text><rect x="910" y="96" width="340" height="362" rx="12" fill="none" stroke="#3fb950" stroke-width="1.2" opacity="0.8"/><text x="928" y="119" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#3fb950" letter-spacing="0.4">ARDUINO VENTUNO Q</text><rect x="50" y="134" width="300" height="80" rx="8" fill="#171d25" stroke="#3a4656" stroke-width="1.5"/><text x="64" y="160" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">3S battery module</text><text x="64" y="180" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">three 18650 cells</text><text x="64" y="197" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">one switch for the whole robot</text><rect x="50" y="244" width="300" height="80" rx="8" fill="#171d25" stroke="#3a4656" stroke-width="1.5"/><text x="64" y="270" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Switched power rail</text><text x="64" y="290" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">tap for the computer</text><rect x="50" y="354" width="300" height="86" rx="8" fill="#171d25" stroke="#3a4656" stroke-width="1.5"/><text x="64" y="380" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Driver board</text><text x="64" y="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">ESP32, IMU, motor drivers</text><text x="64" y="417" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">JSON command protocol</text><rect x="50" y="470" width="300" height="80" rx="8" fill="#171d25" stroke="#3a4656" stroke-width="1.5"/><text x="64" y="496" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Drive train</text><text x="64" y="516" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">six wheels, four driven</text><text x="64" y="533" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">four 12 V gear motors, encoder odometry</text><rect x="490" y="134" width="300" height="80" rx="8" fill="#171d25" stroke="#4fa3ff" stroke-width="1.5"/><text x="504" y="160" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">BJ-P02 top cover</text><text x="504" y="180" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">one 2 mm sheet, cut flat, 9 bends,</text><text x="504" y="197" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">no welds; blank 285.2 x 241.1 mm</text><rect x="490" y="244" width="300" height="80" rx="8" fill="#171d25" stroke="#4fa3ff" stroke-width="1.5"/><text x="504" y="270" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Power harness</text><text x="504" y="290" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">fuse, 90 degree barrel plug</text><rect x="490" y="354" width="300" height="86" rx="8" fill="#171d25" stroke="#4fa3ff" stroke-width="1.5"/><text x="504" y="380" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">BJ-P01 adapter plate</text><text x="504" y="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">on the existing deck holes,</text><text x="504" y="417" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">no drilling</text><rect x="490" y="470" width="300" height="80" rx="8" fill="#171d25" stroke="#4fa3ff" stroke-width="1.5"/><text x="504" y="496" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Cooling and airflow</text><text x="504" y="516" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">40 mm fan, roof grilles,</text><text x="504" y="533" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">number 21 cut in both side walls</text><rect x="930" y="134" width="300" height="80" rx="8" fill="#171d25" stroke="#3fb950" stroke-width="1.5"/><text x="944" y="160" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Qualcomm Dragonwing processor</text><text x="944" y="180" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">Linux side: perception, navigation, AI</text><text x="944" y="197" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">ROS 2</text><rect x="930" y="244" width="300" height="80" rx="8" fill="#171d25" stroke="#3fb950" stroke-width="1.5"/><text x="944" y="270" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Barrel jack power input</text><text x="944" y="290" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">fed from the rover battery bus</text><rect x="930" y="354" width="300" height="86" rx="8" fill="#171d25" stroke="#3fb950" stroke-width="1.5"/><text x="944" y="380" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">STM32H5 microcontroller</text><text x="944" y="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">real-time side, 3.3 V headers</text><rect x="930" y="470" width="300" height="80" rx="8" fill="#171d25" stroke="#3a4656" stroke-width="1.5"/><text x="944" y="496" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Front depth camera</text><text x="944" y="516" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">Nuwa-HP60C</text><path d="M200 214 L200 244" fill="none" stroke="#d29922" stroke-width="2" stroke-linejoin="round" marker-end="url(#ad29922)"/><path d="M350 284 L490 284" fill="none" stroke="#d29922" stroke-width="2" stroke-linejoin="round" marker-end="url(#ad29922)"/><text x="420" y="276" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#d29922" text-anchor="middle">power</text><path d="M790 284 L930 284" fill="none" stroke="#d29922" stroke-width="2" stroke-linejoin="round" marker-end="url(#ad29922)"/><text x="860" y="276" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#d29922" text-anchor="middle">power</text><path d="M200 440 L200 470" fill="none" stroke="#9aa7b4" stroke-width="2" stroke-linejoin="round" marker-end="url(#a9aa7b4)"/><path d="M350 397 L420 397 L420 600 L1350 600 L1350 160 L1230 160" fill="none" stroke="#4fa3ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#a4fa3ff)" marker-start="url(#b4fa3ff)"/><text x="700" y="591" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#4fa3ff" text-anchor="middle">USB: velocity commands, odometry, IMU</text><path d="M1230 510 L1310 510 L1310 192 L1230 192" fill="none" stroke="#3fb950" stroke-width="2" stroke-linejoin="round" marker-end="url(#a3fb950)"/><text x="1304" y="502" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#3fb950" text-anchor="end">USB</text><rect x="30" y="640" width="1340" height="80" rx="8" fill="#171d25" stroke="#d29922" stroke-width="1.5" stroke-dasharray="6 5"/><text x="44" y="666" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#d29922">Provisions designed in, not fitted in the base configuration</text><text x="44" y="686" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa7b4">pan-tilt turret OR lidar on the roof    |    GNSS RTK (ZED-F9P) with rear antenna plate BJ-P03    |    LTE Cat.1 modem    |    front lights and LED sticks</text></svg>